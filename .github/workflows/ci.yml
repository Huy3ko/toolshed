name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "src[dev]" || pip install -e . || pip install -e src
      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.4
          ruff check src/
      - name: Tests
        run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit --skip-editable || true
      - name: Secret scan
        run: |
          # ADR-0002: keine Vela-Pfade, keine Nutzerdaten
          ! grep -rEn "/srv/companion|/home/[a-z_]+|hermes_hugo|router-test" src/ README.md && echo "path scan clean"
      - name: Malicious tool-description guard (ADR-0004)
        run: pytest tests/test_policy_guard.py -v
