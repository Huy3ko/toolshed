<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toolshed — How it works</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#ffffff; font-family:'Inter',sans-serif; color:#0f172a; padding:20px; }
</style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', sans-serif">

  <!-- background dots pattern -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#dbe3ee"/>
    </pattern>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="20" y="10" width="90" height="50" fill="url(#dots)"/>
  <rect x="1170" y="10" width="90" height="50" fill="url(#dots)"/>
  <rect x="20" y="660" width="90" height="50" fill="url(#dots)"/>
  <rect x="1170" y="660" width="90" height="50" fill="url(#dots)"/>

  <!-- TITLE -->
  <line x1="360" y1="42" x2="440" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="56" text-anchor="middle" font-size="44" font-weight="800" fill="#1e3a8a" letter-spacing="4">TOOLSHED</text>
  <line x1="840" y1="42" x2="920" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ============ EXTERNAL PROXY BOX ============ -->
  <rect x="383" y="80" width="514" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <!-- shield icon -->
  <circle cx="418" cy="108" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 418 100 L 426 104 L 426 111 Q 426 117 418 120 Q 410 117 410 111 L 410 104 Z" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="443" y="113" font-size="15" font-weight="700" fill="#1e40af">EXTERNAL PROXY <tspan fill="#2563eb" font-weight="400">— outside the agent core</tspan></text>
  <text x="418" y="146" font-size="13.5" fill="#0f172a">•  deterministic rules (local, free)</text>
  <text x="418" y="168" font-size="13.5" fill="#0f172a">•  stable baseline surface per session</text>
  <text x="418" y="190" font-size="13.5" fill="#0f172a">•  controlled recovery; expanded tools persist</text>
  <rect x="400" y="200" width="480" height="22" rx="5" fill="#eff6ff"/>
  <text x="412" y="215" font-size="11" fill="#475569">ⓘ  the agent core is never modified — Toolshed only decides what the provider request carries</text>

  <!-- ============ HOST BOUNDARY ============ -->
  <rect x="35" y="150" width="1210" height="380" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ============ FIRST USER TURN ============ -->
  <rect x="75" y="100" width="230" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="105" cy="128" r="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="105" cy="124" r="4" fill="#2563eb"/>
  <path d="M 97 134 Q 105 128 113 134" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="128" y="124" font-size="13" font-weight="700" fill="#0f172a">FIRST USER TURN</text>
  <text x="128" y="143" font-size="12" fill="#64748b">classified once,</text>
  <text x="128" y="159" font-size="12" fill="#64748b">sticky for the session</text>
  <line x1="307" y1="130" x2="375" y2="140" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- ============ NARROW SURFACE ============ -->
  <rect x="745" y="255" width="215" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="775" cy="285" r="13" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <path d="M 768 279 L 782 279 L 777 287 L 777 292 L 773 292 L 773 287 Z" fill="#059669"/>
  <text x="798" y="282" font-size="13" font-weight="700" fill="#065f46">NARROW SURFACE</text>
  <text x="798" y="300" font-size="12" fill="#64748b">likely tools + floor</text>
  <!-- CONFIDENT arrow -->
  <path d="M 620 195 Q 700 220 742 252" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="655" y="222" font-size="12" font-weight="600" fill="#059669">CONFIDENT → NARROW</text>

  <!-- ============ FULL SURFACE ============ -->
  <rect x="120" y="295" width="230" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <circle cx="150" cy="325" r="13" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="143" y="318" width="14" height="14" rx="3" fill="none" stroke="#ea580c" stroke-width="1.8"/>
  <line x1="146" y1="318" x2="146" y2="332" stroke="#ea580c" stroke-width="1.8"/>
  <line x1="154" y1="318" x2="154" y2="332" stroke="#ea580c" stroke-width="1.8"/>
  <text x="173" y="322" font-size="13" font-weight="700" fill="#9a3412">FULL SURFACE</text>
  <text x="173" y="340" font-size="12" fill="#64748b">nothing removed, ever</text>
  <path d="M 500 230 Q 380 260 355 292" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="245" y="272" font-size="12" font-weight="600" fill="#b45309">NOT SURE → FULL SURFACE</text>

  <!-- ============ MODEL PROVIDER REQUEST ============ -->
  <rect x="520" y="390" width="330" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <ellipse cx="560" cy="425" rx="16" ry="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M 544 425 L 544 445 Q 560 453 576 445 L 576 425" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="590" y="422" font-size="13" font-weight="700" fill="#6d28d9">MODEL PROVIDER REQUEST</text>
  <text x="590" y="441" font-size="15" font-weight="800" fill="#0f172a">selected schemas only</text>
  <text x="590" y="461" font-size="12" fill="#64748b">cache holds the stable session prefix on every turn</text>

  <!-- narrow -> model -->
  <path d="M 855 318 Q 900 350 855 395 L 858 420" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- ============ WHAT TOOLSHED IS / ISN'T ============ -->
  <rect x="990" y="255" width="255" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="1020" cy="285" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="1014" y="279" width="12" height="10" rx="2" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <path d="M 1016 279 L 1016 276 Q 1020 273 1024 276 L 1024 279" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1043" y="278" font-size="10.5" font-weight="700" fill="#991b1b">NOT AN AUTHORIZATION BOUNDARY</text>
  <text x="1043" y="294" font-size="10.5" fill="#475569">routing / context efficiency only</text>
  <text x="1043" y="307" font-size="10" fill="#64748b">recovery checks registry, not permissions</text>
  <text x="1043" y="322" font-size="10" fill="#64748b">no semantic discovery layer in v0.1.x</text>

  <!-- ============ CACHE HIT ============ -->
  <rect x="885" y="390" width="250" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="915" cy="425" r="13" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <path d="M 918 415 L 910 428 L 916 428 L 912 438 L 922 424 L 916 424 Z" fill="#059669"/>
  <text x="938" y="422" font-size="13" font-weight="700" fill="#065f46">CACHE HIT EVERY TURN</text>
  <text x="938" y="440" font-size="12" fill="#64748b">stable prefix = cheap turns</text>
  <text x="938" y="455" font-size="11" fill="#94a3b8">expanded toolsets persist for the session</text>
  <path d="M 852 430 L 883 428" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>

  <!-- ============ CAPABILITY MISSING / RECOVER ============ -->
  <rect x="75" y="410" width="290" height="95" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="105" cy="445" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M 98 452 L 108 438" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 104 436 L 110 440 L 106 445 Z" fill="#dc2626"/>
  <text x="128" y="438" font-size="13" font-weight="700" fill="#991b1b">CAPABILITY MISSING?</text>
  <text x="128" y="456" font-size="11.5" font-weight="600" fill="#0f172a">request_toolset — explicit</text>
  <text x="128" y="473" font-size="11.5" font-weight="600" fill="#0f172a">middleware recovery — automatic</text>
  <text x="128" y="490" font-size="10.5" fill="#64748b">registered toolsets · no session restart</text>
  <path d="M 518 445 L 373 447" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="395" y="437" font-size="11" fill="#94a3b8">missing tool mid-task?</text>

  <!-- ============ MULTI-AGENT ============ -->
  <rect x="35" y="510" width="1210" height="120" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="72" cy="540" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="67" cy="537" r="4" fill="#2563eb"/>
  <circle cx="77" cy="537" r="4" fill="#2563eb"/>
  <path d="M 62 549 Q 72 543 82 549" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="97" y="545" font-size="14" font-weight="700" fill="#0f172a">MULTI-AGENT <tspan fill="#64748b" font-weight="400">— one shed, many workers · every profile gets its own isolated instance</tspan></text>

  <rect x="75" y="560" width="350" height="55" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="105" cy="587" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="99" y="582" width="12" height="9" rx="2" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="102" y1="582" x2="102" y2="579" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="108" y1="582" x2="108" y2="579" stroke="#2563eb" stroke-width="1.5"/>
  <text x="127" y="582" font-size="12" font-weight="700" fill="#1e40af">AGENT A</text>
  <text x="127" y="600" font-size="11" fill="#64748b">own routes · own grants ·</text>
  <text x="127" y="613" font-size="11" fill="#64748b">own learning state</text>

  <rect x="475" y="560" width="350" height="55" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="505" cy="587" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="499" y="582" width="12" height="9" rx="2" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="502" y1="582" x2="502" y2="579" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="508" y1="582" x2="508" y2="579" stroke="#2563eb" stroke-width="1.5"/>
  <text x="527" y="582" font-size="12" font-weight="700" fill="#1e40af">AGENT B</text>
  <text x="527" y="600" font-size="11" fill="#64748b">own routes · own grants ·</text>
  <text x="527" y="613" font-size="11" fill="#64748b">own learning state</text>

  <rect x="875" y="560" width="350" height="55" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="905" cy="587" r="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="900" y="583" width="10" height="8" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 902 583 L 902 580 Q 905 578 908 580 L 908 583" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="927" y="582" font-size="12" font-weight="700" fill="#475569">NEVER SHARED</text>
  <text x="927" y="600" font-size="11" fill="#64748b">workflow data never</text>
  <text x="927" y="613" font-size="11" fill="#64748b">crosses agents</text>

  <!-- ============ TRUST BAR ============ -->
  <rect x="35" y="645" width="1210" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="80" cy="675" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 72 682 L 78 672 L 83 677 L 89 666" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M 83 666 L 89 666 L 89 671" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="108" y="672" font-size="14" font-weight="700" fill="#0f172a">31% less input on fresh installs   ·   32–70% in controlled A/B workloads   ·   fail-open by design</text>
  <text x="108" y="692" font-size="12" fill="#64748b">github.com/Huy3ko/toolshed   ·   MIT   ·   fork of hermes-token-router</text>

</svg>
</body>
</html>
