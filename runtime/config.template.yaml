about: Default configuration shipped with Toolshed
title: toolshed default config
labels: ''
assignees: ''
---

# Hermes Tool Router v2 configuration — disabled until explicitly enabled.
#
# SETUP (after install):
#   1. hermes plugins enable hermes-token-router --allow-tool-override
#   2. set global.enabled: true below (or add a profiles.<name> section)
#
# See README "Quick start" for the full flow.

global:
  enabled: false            # ← set to true to activate routing
  routing_scope: first_turn
  expansion_mode: monotonic
  shrink_mid_session: false
  floor_toolsets: ["terminal", "file", "skills", "memory", "web"]
  deterministic_rules_enabled: true
  confidence_threshold: 0.90
  router_timeout_ms: 750
  router_hard_timeout_ms: 1200
  fail_open: true
  auto_recover_registered_tools: true
  classifier:
    enabled: false
    provider: null
    model: null
    base_url: null
    api_key_env: null
  metrics:
    enabled: true
    local_only: true
    retain_days: 30

profiles: {}
  # Optional per-profile overrides. Key = Hermes profile name.
  # Example:
  # my-agent:
  #   enabled: true

# --- Shadow learning bridge (optional, profile-local) ---
shadow:
  enabled: true
  store_path: learning/profiles.json
  events_path: learning/events.jsonl
  floor_toolsets: ["terminal", "file", "skills", "memory", "web"]
  max_warm: 8
  channel: cli
