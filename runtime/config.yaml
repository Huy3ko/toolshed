# Hermes Tool Router v2 runtime configuration.
# Routing is disabled until explicitly enabled for the target profile.
global:
  enabled: false
  mode: active
  routing_scope: first_turn
  expansion_mode: monotonic
  shrink_mid_session: false
  floor_toolsets: ["terminal", "file", "skills", "memory", "web"]
  deterministic_rules_enabled: true
  confidence_threshold: 0.90
  router_timeout_ms: 750
  router_hard_timeout_ms: 1200
  fail_open: true
  auto_recover_registered_tools: true
  classifier:
    enabled: false
    provider: null
    model: null
    base_url: null
    api_key_env: null
  metrics:
    enabled: true
    local_only: true
    retain_days: 30

profiles: {}

shadow:
  enabled: true
  store_path: learning/profiles.json
  events_path: learning/events.jsonl
  floor_toolsets: ["terminal", "file", "skills", "memory", "web"]
  max_warm: 8
  channel: cli
