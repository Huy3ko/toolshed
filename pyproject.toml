[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolshed"
version = "0.1.6"
description = "An adaptive tool-surface proxy for Hermes — reduces repeated tool-schema overhead while preserving on-demand recovery."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Toolshed contributors (based on hermes-token-router by Jonathan Rivera)" }
]
requires-python = ">=3.10"

[tool.setuptools]
packages = ["toolshed", "toolshed.learning_store", "toolshed.telemetry_store"]
package-dir = { "" = "src" }

[tool.ruff]
# Fork erbt Python 3.9-kompatible Annotationen (UP006/UP045/UP035 bewusst offen
# bis Hermes-Minimalversion geklärt ist); BLE001: fail-open try/except Exception
# ist hier ARCHITEKTUR (ADR-0004: Router-Fehler = volle Toolfläche, nie weniger).
[tool.ruff.lint]
ignore = ["UP006", "UP045", "UP035", "UP037", "BLE001", "S110", "I001", "SIM102", "FURB192", "RUF013"]

# F401: Die try/except-Doppelimporte (Paket vs. flacher Hermes-Loader) importieren
# Namen bewusst weiter — der Loader-Pfad braucht sie im Modul-Namespace. Kein Fehler.
[tool.ruff.lint.per-file-ignores]
"src/toolshed/__init__.py" = ["F401"]
"__init__.py" = ["F401"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.4", "PyYAML>=6", "pip-audit>=2.7"]
