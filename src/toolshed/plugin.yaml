name: hermes-token-router
version: 0.2.0
description: "Authorized, per-request tool selection for the Hermes provider request — including the first turn of a session, with fail-open routing and native recovery."
author: "Toolshed contributors (based on hermes-token-router by Jonathan Rivera)"
license: MIT
kind: standalone
requires_env: []
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_end
provides_middleware:
  - tool_request
  - llm_request
provides_tools:
  - request_toolset
